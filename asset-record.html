<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Record · Asset Tracking</title>
<link rel="stylesheet" href="shared/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<script>
  if (location.protocol === "file:") {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div");
      b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 16px;font:600 13px -apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;";
      b.textContent = "This app must be opened through a local web server, not by double-clicking the file. Double-click start-local-server.bat in this folder, then open the page it launches. See README.md for details.";
      document.body.insertBefore(b, document.body.firstChild);
    });
  }
</script>
<div id="page-content">
  <div id="not-found" class="card card-pad" style="display:none;">
    <div class="empty-state">Asset Not Found — invalid QR code or Asset ID. <a class="text-link" href="asset-register.html">Back to Asset Register</a></div>
  </div>

  <div id="record-wrap" style="display:none;">
    <div class="page-toolbar">
      <div>
        <h2 style="margin:0 0 4px;" id="asset-title">—</h2>
        <div class="muted" id="asset-subtitle"></div>
      </div>
      <div id="status-badges" style="display:flex; gap:8px;"></div>
    </div>

    <div class="dashboard-grid" style="grid-template-columns: 1fr 300px;">
      <div class="card card-pad">
        <div class="tab-bar" id="tab-bar">
          <button class="tab-btn active" data-tab="general">General Details</button>
          <button class="tab-btn" data-tab="status">Asset Status</button>
          <button class="tab-btn" data-tab="assignment">Assignment History</button>
          <button class="tab-btn" data-tab="movement">Movement History</button>
          <button class="tab-btn" data-tab="inspections">Inspections</button>
          <button class="tab-btn" data-tab="calibration">Calibration</button>
          <button class="tab-btn" data-tab="repair">Repair History</button>
          <button class="tab-btn" data-tab="documents">Documents</button>
          <button class="tab-btn" data-tab="qrcode">QR Code</button>
          <button class="tab-btn" data-tab="audit">Audit Log</button>
        </div>

        <div class="tab-panel active" id="tab-general"></div>
        <div class="tab-panel" id="tab-status"></div>
        <div class="tab-panel" id="tab-assignment"></div>
        <div class="tab-panel" id="tab-movement"></div>
        <div class="tab-panel" id="tab-inspections"></div>
        <div class="tab-panel" id="tab-calibration"></div>
        <div class="tab-panel" id="tab-repair"></div>
        <div class="tab-panel" id="tab-documents"></div>
        <div class="tab-panel" id="tab-qrcode"></div>
        <div class="tab-panel" id="tab-audit"></div>
      </div>

      <div class="card card-pad">
        <div class="section-title">Available Actions</div>
        <div style="display:flex; flex-direction:column; gap:8px;" id="available-actions"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db, storage } from "./shared/firebase-config.js";
  import { COLLECTIONS } from "./shared/collections.js";
  import {
    initLayout, el, toast, fetchAll, fetchOne, logAudit, getActingAs, nowISO, todayISO, formatDate, formatDateTime, formatCurrency, openModal, closeModal,
    findOpenIncident, findOpenRecovery, findOpenRetirement, findOpenRecharge, buildQrLabel,
  } from "./shared/common.js";
  import {
    collection, query, where, orderBy, getDocs, doc, updateDoc,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    ref, uploadBytes, getDownloadURL, listAll, deleteObject,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  initLayout("asset-register", "Asset Record");

  const params = new URLSearchParams(window.location.search);
  const assetId = params.get("id");

  const STATUS_BADGE = {
    Available: "green", Assigned: "teal", "Awaiting Inspection": "amber",
    "Under Repair": "amber", "Away for Calibration": "amber", Retired: "slate",
    Missing: "red", Stolen: "red", "Lost in Transit": "red",
  };

  let asset = null;
  let categories = [], types = [], suppliers = [], employees = [], locations = [];

  async function load() {
    if (!assetId) return showNotFound();
    asset = await fetchOne(COLLECTIONS.ASSET_REGISTER, assetId);
    if (!asset) return showNotFound();

    [categories, types, suppliers, employees, locations] = await Promise.all([
      fetchAll(COLLECTIONS.ASSET_CATEGORIES),
      fetchAll(COLLECTIONS.ASSET_TYPES),
      fetchAll(COLLECTIONS.SUPPLIER_REGISTER),
      fetchAll(COLLECTIONS.EMPLOYEE_REGISTER),
      fetchAll(COLLECTIONS.LOCATION_REGISTER),
    ]);

    document.getElementById("record-wrap").style.display = "";
    renderHeader();
    renderGeneralTab();
    renderStatusTab();
    renderAssignmentTab();
    renderMovementTab();
    renderInspectionsTab();
    renderCalibrationTab();
    renderRepairTab();
    renderDocumentsTab();
    renderQrTab();
    renderAuditTab();
    await renderActions();
  }

  function showNotFound() {
    document.getElementById("not-found").style.display = "";
  }

  function supplierName(id) { return suppliers.find((s) => s.id === id)?.SupplierName || id || "—"; }
  function employeeName(id) { return employees.find((e) => e.id === id)?.FullName || id || "—"; }
  function locationName(id) { return locations.find((l) => l.id === id)?.LocationName || id || "—"; }

  function renderHeader() {
    document.getElementById("asset-title").textContent = `${asset.AssetName} — ${asset.id}`;
    document.getElementById("asset-subtitle").textContent = asset.StockItem
      ? `Stock item · Qty ${asset.Quantity ?? 0}`
      : `${asset.Category || ""} · ${asset.AssetType || ""} · SN ${asset.SerialNumber || "—"}`;
    const badges = document.getElementById("status-badges");
    badges.innerHTML = "";
    badges.appendChild(el("span", { class: `badge badge-${STATUS_BADGE[asset.Status] || "slate"}` }, asset.Status || "Unknown"));
    if (asset.Active === false) badges.appendChild(el("span", { class: "badge badge-slate" }, "Inactive"));
  }

  /* ---------------- Tabs ---------------- */
  document.getElementById("tab-bar").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
  });

  function infoRow(label, value) {
    return el("div", { style: "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--slate-100); font-size:13.5px;" }, [
      el("span", { class: "muted" }, label),
      el("span", {}, value ?? "—"),
    ]);
  }

  function renderGeneralTab() {
    const host = document.getElementById("tab-general");
    host.innerHTML = "";
    host.appendChild(el("div", { style: "display:flex; justify-content:flex-end; margin-bottom:10px;" },
      el("button", { class: "btn btn-secondary btn-sm", onclick: openEditGeneral }, "Edit General Details")
    ));
    const grid = el("div", {});
    if (!asset.StockItem) {
      grid.appendChild(infoRow("Manufacturer", asset.Manufacturer));
      grid.appendChild(infoRow("Model", asset.Model));
      grid.appendChild(infoRow("Serial Number", asset.SerialNumber));
    }
    grid.appendChild(infoRow("Category", asset.Category));
    grid.appendChild(infoRow("Asset Type", asset.AssetType));
    grid.appendChild(infoRow("Description", asset.Description));
    if (!asset.StockItem) {
      grid.appendChild(infoRow("Supplier", supplierName(asset.Supplier)));
      grid.appendChild(infoRow("Purchase Order", asset.PurchaseOrder));
      grid.appendChild(infoRow("Purchase Date", formatDate(asset.PurchaseDate)));
      grid.appendChild(infoRow("Purchase Cost", formatCurrency(asset.PurchaseCost)));
      grid.appendChild(infoRow("Replacement Cost", formatCurrency(asset.ReplacementCost)));
      grid.appendChild(infoRow("Warranty Expiry", formatDate(asset.WarrantyExpiry)));
      grid.appendChild(infoRow("Expected Service Life", asset.ServiceLife ? `${asset.ServiceLife} years` : "—"));
    } else {
      grid.appendChild(infoRow("Quantity in Stock", asset.Quantity ?? 0));
    }
    host.appendChild(grid);
  }

  function openEditGeneral() {
    const form = el("form", { class: "field-grid" });
    form.innerHTML = `
      <div class="field span-2"><label>Asset Name *</label><input name="AssetName" required /></div>
      <div class="field"><label>Manufacturer</label><input name="Manufacturer" /></div>
      <div class="field"><label>Model</label><input name="Model" /></div>
      <div class="field span-2"><label>Description *</label><textarea name="Description" required></textarea></div>
      <div class="field"><label>Purchase Cost (£)</label><input type="number" step="0.01" name="PurchaseCost" /></div>
      <div class="field"><label>Replacement Cost (£)</label><input type="number" step="0.01" name="ReplacementCost" /></div>
      <div class="field"><label>Warranty Expiry</label><input type="date" name="WarrantyExpiry" /></div>
      <div class="form-actions" style="grid-column:1/-1;">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    `;
    Object.entries(asset).forEach(([k, v]) => {
      const input = form.querySelector(`[name="${k}"]`);
      if (input) input.value = v ?? "";
    });
    const panel = openModal("Edit General Details", form, { wide: true });
    panel.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const updates = {
        AssetName: fd.get("AssetName"),
        Manufacturer: fd.get("Manufacturer") || null,
        Model: fd.get("Model") || null,
        Description: fd.get("Description"),
        PurchaseCost: fd.get("PurchaseCost") ? Number(fd.get("PurchaseCost")) : null,
        ReplacementCost: fd.get("ReplacementCost") ? Number(fd.get("ReplacementCost")) : null,
        WarrantyExpiry: fd.get("WarrantyExpiry") || null,
      };
      await updateDoc(doc(db, COLLECTIONS.ASSET_REGISTER, asset.id), updates);
      await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Updated general details for ${updates.AssetName}` });
      toast("Asset updated", "success");
      closeModal();
      load();
    });
  }

  function renderStatusTab() {
    const host = document.getElementById("tab-status");
    host.innerHTML = "";
    host.appendChild(el("p", { class: "muted" }, "These fields are controlled by asset processes (allocation, transfer, calibration, retirement…). Direct editing is disabled until those workflow modules are built."));
    host.appendChild(infoRow("Status", asset.Status));
    host.appendChild(infoRow("Condition", asset.Condition));
    host.appendChild(infoRow("Current Location", asset.CurrentLocation ? locationName(asset.CurrentLocation) : "—"));
    host.appendChild(infoRow("Current Employee", asset.CurrentEmployee ? employeeName(asset.CurrentEmployee) : "—"));
    host.appendChild(infoRow("Active", asset.Active === false ? "No" : "Yes"));
    host.appendChild(infoRow("Last Calibration Date", formatDate(asset.LastCalibrationDate)));
    host.appendChild(infoRow("Next Calibration Due Date", formatDate(asset.NextCalibrationDueDate)));
  }

  async function renderCollectionTab(hostId, collectionName, assetField, columns, emptyMsg) {
    const host = document.getElementById(hostId);
    host.innerHTML = `<div class="empty-state">Loading…</div>`;
    try {
      const q = query(collection(db, collectionName), where(assetField, "==", asset.id));
      const snap = await getDocs(q);
      if (snap.empty) {
        host.innerHTML = "";
        host.appendChild(el("div", { class: "empty-state" }, emptyMsg));
        return;
      }
      const table = el("table", { class: "data-table" });
      const thead = el("thead", {}, el("tr", {}, columns.map((c) => el("th", {}, c.label))));
      const tbody = el("tbody", {});
      snap.docs.forEach((d) => {
        const row = d.data();
        tbody.appendChild(el("tr", { class: "static-row" }, columns.map((c) => el("td", {}, c.render ? c.render(row) : (row[c.key] ?? "—")))));
      });
      table.appendChild(thead);
      table.appendChild(tbody);
      host.innerHTML = "";
      host.appendChild(table);
    } catch (err) {
      host.innerHTML = "";
      host.appendChild(el("div", { class: "empty-state" }, emptyMsg));
    }
  }

  function renderAssignmentTab() {
    renderCollectionTab("tab-assignment", COLLECTIONS.ASSIGNMENT_HISTORY, "AssetID", [
      { label: "Type", key: "AssignmentType" },
      { label: "Employee", render: (r) => employeeName(r.EmployeeID) },
      { label: "Start", render: (r) => formatDateTime(r.AssignmentStartDate) },
      { label: "End", render: (r) => formatDateTime(r.AssignmentEndDate) },
      { label: "Notes", key: "Notes" },
    ], "No assignment history yet — this will populate once the Allocate/Transfer/Return process is built.");
  }
  function renderMovementTab() {
    renderCollectionTab("tab-movement", COLLECTIONS.MOVEMENT_REGISTER, "AssetID", [
      { label: "Action", key: "Action" },
      { label: "From", render: (r) => locationName(r.FromLocation) },
      { label: "To", render: (r) => locationName(r.ToLocation) },
      { label: "Date", render: (r) => formatDateTime(r.MovementDateTime) },
      { label: "Notes", key: "Notes" },
    ], "No movement history yet.");
  }
  function renderInspectionsTab() {
    renderCollectionTab("tab-inspections", COLLECTIONS.ASSET_INSPECTION, "AssetID", [
      { label: "Date", render: (r) => formatDateTime(r.InspectionDate) },
      { label: "Inspected By", key: "InspectedBy" },
      { label: "Condition", key: "AssetCondition" },
      { label: "Outcome", key: "InspectionOutcome" },
      { label: "Damage / Missing", render: (r) => [r.DamageDescription, r.MissingComponents].filter(Boolean).join(" · ") || "—" },
      { label: "Photo", render: (r) => (r.InspectionPhotos ? el("a", { class: "text-link", href: r.InspectionPhotos, target: "_blank" }, "View") : "—") },
    ], "No inspections recorded yet — these are created automatically when a returned asset is inspected.");
  }
  function renderCalibrationTab() {
    renderCollectionTab("tab-calibration", COLLECTIONS.CALIBRATION_REGISTER, "AssetID", [
      { label: "Provider", key: "CalibrationProvidor" },
      { label: "Status", key: "CalibrationStatus" },
      { label: "Start", render: (r) => formatDate(r.CalibrationStartDate) },
      { label: "Completed", render: (r) => formatDate(r.CalibrationCompletionDate) },
      { label: "Result", key: "CalibrationResult" },
      { label: "Next Due", render: (r) => formatDate(r.NextCalibrationDueDate) },
    ], "No calibration records yet — this will populate once the Calibration process is built.");
  }
  function renderRepairTab() {
    renderCollectionTab("tab-repair", COLLECTIONS.REPAIR_REGISTER, "AssetID", [
      { label: "Provider", key: "RepairProvidor" },
      { label: "Status", key: "RepairStatus" },
      { label: "Type", key: "RepairType" },
      { label: "Cost", render: (r) => formatCurrency(r.RepairCost) },
      { label: "Completed", render: (r) => formatDate(r.CompletionDate) },
    ], "No repair history yet — this will populate once the Repair process is built.");
  }
  function renderAuditTab() {
    renderCollectionTab("tab-audit", COLLECTIONS.AUDIT_LOG, "recordId", [
      { label: "When", render: (r) => formatDateTime(r.timestampClient) },
      { label: "Action", key: "action" },
      { label: "By", key: "performedByName" },
      { label: "Details", key: "description" },
    ], "No audit history yet.");
  }

  /* ---------------- Documents (Firebase Storage) ---------------- */
  function renderDocumentsTab() {
    const host = document.getElementById("tab-documents");
    host.innerHTML = "";
    const uploadRow = el("div", { style: "display:flex; gap:10px; align-items:center; margin-bottom:16px;" });
    const fileInput = el("input", { type: "file", id: "doc-file-input" });
    const uploadBtn = el("button", { class: "btn btn-primary btn-sm" }, "Upload Document");
    uploadRow.appendChild(fileInput);
    uploadRow.appendChild(uploadBtn);
    host.appendChild(uploadRow);
    const listHost = el("div", { id: "doc-list" }, el("div", { class: "empty-state" }, "Loading documents…"));
    host.appendChild(listHost);

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { toast("Choose a file first.", "info"); return; }
      uploadBtn.disabled = true;
      try {
        const storageRef = ref(storage, `assets/${asset.id}/documents/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef, file);
        await logAudit({ recordType: "Asset", recordId: asset.id, action: "Update", description: `Uploaded document "${file.name}"` });
        toast("Document uploaded", "success");
        fileInput.value = "";
        loadDocuments();
      } catch (err) {
        console.error(err);
        toast("Upload failed: " + err.message, "error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function loadDocuments() {
      listHost.innerHTML = "";
      try {
        const folderRef = ref(storage, `assets/${asset.id}/documents`);
        const res = await listAll(folderRef);
        if (res.items.length === 0) {
          listHost.appendChild(el("div", { class: "empty-state" }, "No documents attached yet."));
          return;
        }
        for (const itemRef of res.items) {
          const url = await getDownloadURL(itemRef);
          const displayName = itemRef.name.replace(/^\d+_/, "");
          const row = el("div", { style: "display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--slate-100);" }, [
            el("a", { href: url, target: "_blank", class: "text-link" }, displayName),
            el("button", { class: "btn btn-ghost btn-sm" }, "Remove"),
          ]);
          row.querySelector("button").addEventListener("click", async () => {
            await deleteObject(itemRef);
            toast("Document removed", "success");
            loadDocuments();
          });
          listHost.appendChild(row);
        }
      } catch (err) {
        listHost.innerHTML = "";
        listHost.appendChild(el("div", { class: "empty-state" }, "No documents attached yet."));
      }
    }
    loadDocuments();
  }

  /* ---------------- QR Code ---------------- */
  function renderQrTab() {
    const host = document.getElementById("tab-qrcode");
    host.innerHTML = "";
    if (asset.StockItem || !asset.QRCode) {
      host.appendChild(el("div", { class: "empty-state" }, "Stock items are managed by quantity and do not have an individual QR Code."));
      return;
    }
    const wrap = el("div", { class: "qr-canvas-wrap" });
    const qrDiv = el("div", {});
    wrap.appendChild(qrDiv);
    wrap.appendChild(el("div", { style: "font-weight:600;" }, asset.QRCode));
    wrap.appendChild(el("div", { class: "muted" }, asset.AssetName));
    host.appendChild(wrap);
    host.appendChild(el("div", { style: "text-align:center; margin-top:14px;" },
      el("button", { class: "btn btn-secondary btn-sm", onclick: () => window.print() }, "Print QR Label")
    ));
    host.appendChild(el("p", { class: "muted", style: "text-align:center; font-size:11.5px; margin-top:6px;" }, "Prints as a 25.4mm × 12.6mm label — QR code + Asset ID."));
    new QRCode(qrDiv, { text: asset.QRCode, width: 140, height: 140 });

    // Hidden label sized for the actual printer — this is what the
    // button above prints, not the larger on-screen preview.
    const printLabel = buildQrLabel({ qrCode: asset.QRCode, assetId: asset.id });
    printLabel.id = "qr-print-area";
    host.appendChild(printLabel);
  }

  /* ---------------- Available Actions ---------------- */
  async function renderActions() {
    const host = document.getElementById("available-actions");
    host.innerHTML = "";
    const actions = [{ label: "Duplicate Asset", href: `create-asset.html` }];

    const [openIncident, openRecovery, openRetirement, openRecharge] = await Promise.all([
      findOpenIncident(asset.id),
      findOpenRecovery(asset.id),
      findOpenRetirement(asset.id),
      findOpenRecharge(asset.id),
    ]);

    if (!asset.StockItem) {
      if (asset.Status === "Available") {
        actions.push({ label: "Allocate Asset", href: `allocate-asset.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status === "Assigned" && asset.CurrentEmployee) {
        actions.push({ label: "Transfer Asset", href: `transfer-asset.html?employee=${encodeURIComponent(asset.CurrentEmployee)}&asset=${encodeURIComponent(asset.id)}` });
        actions.push({ label: "Receive Returned Asset", href: `return-asset.html?employee=${encodeURIComponent(asset.CurrentEmployee)}&asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status === "Awaiting Inspection") {
        actions.push(
          asset.CurrentEmployee
            ? { label: "Inspect Returned Asset", href: `return-asset.html?employee=${encodeURIComponent(asset.CurrentEmployee)}&asset=${encodeURIComponent(asset.id)}` }
            : { label: "Inspect Returned Asset", href: `return-asset.html` }
        );
      }

      if (asset.Status === "Under Repair") {
        actions.push({ label: "Continue Repair Job", href: `repair.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status === "Away for Calibration") {
        actions.push({ label: "Complete Calibration", href: `calibration.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status === "Available" || asset.Status === "Assigned") {
        const type = types.find((t) => t.AssetTypeName === asset.AssetType);
        if (!type || type.CalibrationRequired !== false) {
          actions.push({ label: "Start Calibration", href: `calibration.html?asset=${encodeURIComponent(asset.id)}` });
        }
      }

      if (openIncident) {
        actions.push({ label: `Continue Incident (${openIncident.id})`, href: `incident.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (!["Missing", "Stolen", "Lost in Transit", "Retired"].includes(asset.Status)) {
        actions.push({ label: "Report Damage / Missing / Stolen", href: `incident.html?asset=${encodeURIComponent(asset.id)}` });
      }

      if (openRecovery) {
        actions.push({ label: `Continue Recovery (${openRecovery.id})`, href: `recovery.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status !== "Retired") {
        actions.push({ label: "Start Recovery", href: `recovery.html?asset=${encodeURIComponent(asset.id)}` });
      }

      if (openRecharge) {
        actions.push({ label: `Continue Recharge (${openRecharge.id})`, href: `recharge.html?asset=${encodeURIComponent(asset.id)}` });
      }

      if (openRetirement) {
        actions.push({ label: `Continue Retirement (${openRetirement.id})`, href: `retirement.html?asset=${encodeURIComponent(asset.id)}` });
      } else if (asset.Status !== "Retired") {
        actions.push({ label: "Retire Asset", href: `retirement.html?asset=${encodeURIComponent(asset.id)}` });
      }
    }

    actions.forEach((a) => {
      const btn = el("a", { class: "btn btn-secondary", href: a.href || "#", style: "justify-content:flex-start;" }, a.label);
      if (a.soon) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          toast(`${a.label} is planned for the next build phase.`, "info");
        });
      }
      host.appendChild(btn);
    });
  }

  load();
</script>
</body>
</html>
